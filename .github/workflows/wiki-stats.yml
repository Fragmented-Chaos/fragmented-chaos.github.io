name: wiki-stats

# 每周抓一次 MC百科 的贡献数据，写进 data/wiki-stats.json。
# 抓不到就保留旧文件（脚本自己处理），不会把站点搞坏。

on:
  schedule:
    - cron: "0 3 * * 1"   # 每周一 03:00 UTC（北京 11:00）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-stats
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 抓取贡献数据
        run: python3 .github/scripts/fetch_wiki_stats.py

      - name: 有变化就提交
        run: |
          if git diff --quiet -- data/wiki-stats.json; then
            echo "数据没有变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wiki-stats.json
          git commit -m "chore: 更新百科贡献数据"
          git push
