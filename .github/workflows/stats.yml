name: stats

# 每周抓一次站点的"活数据"，写进 data/ 下的两个 JSON。
# 抓不到就保留旧文件（脚本各自处理），不会把站点搞坏。

on:
  schedule:
    - cron: "0 3 * * 1"   # 每周一 03:00 UTC（北京 11:00）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 抓 MC百科贡献
        run: python3 .github/scripts/fetch_wiki_stats.py

      - name: 抓 GitHub 贡献
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/fetch_github_contrib.py

      - name: 有变化就提交
        run: |
          if git diff --quiet -- data/; then
            echo "数据没有变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: 更新统计"
          git push
