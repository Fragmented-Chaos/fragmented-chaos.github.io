# 音乐页配置。
#
# 页面上只有一个列表：点哪首，卡片里的官方播放器就播哪首。
# 我们**不**控制平台播放器的播放/暂停/进度/音量（跨域 iframe 做不到），
# 所以页面上没有自建播放控件；也不要接第三方逆向接口去取音频直链。
netease:
  # 方式一：整张歌单一个官方播放器
  #   https://music.163.com/playlist?id=123456789  → 填 123456789
  playlist_id: ""

  # 方式二：逐首列出（playlist_id 留空时生效）
  #   https://music.163.com/song?id=3379996850 → 填 3379996850
  # title / artist 从歌曲页的公开信息里抄（不抓接口），填了列表里就能看到
  songs:
    - id: "3379996850"
      title: "拼接乌托邦"
      artist: "Ciyo / 见过夏天P / 乌托邦P"
      label: "我的歌单"
