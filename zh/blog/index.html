<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>博客 · Fragmented_Chaos</title>
<meta name="description" content="Fragmented_Chaos 的博客。">
<script>
  (function () {
    try {
      var m = /[?&]theme=(light|dark)\b/.exec(location.search);
      var t = m ? m[1] : localStorage.getItem('site-v2.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* 隐私模式忽略 */ }
  })();
</script>
<link rel="stylesheet" href="../../assets/base.css">
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <a class="mark" href="../../index.html">Fragmented<b>_</b>Chaos</a>
    <nav class="nav">
      <a href="../mods/">模组</a>
      <a href="./" aria-current="page">博客</a>
      <a href="../music/">音乐</a>
      <a href="../experience/">经历</a>
      <a href="../about/">关于</a>
      <span class="lang">
        <a href="../../zh/blog/" aria-current="true">简</a>
        <a href="../../zh-hant/blog/">繁</a>
        <a href="../../en/blog/">EN</a>
      </span>
      <button type="button" class="theme-toggle" data-theme-toggle
              aria-pressed="false"
              data-label-to-dark="切换到暗色主题" data-label-to-light="切换到亮色主题">
        <span class="sr-only">切换主题</span>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/>
        </svg>
      </button>
    </nav>
  </div>
</header>

<main>
  <section class="wrap page-head">
    <p class="kicker rise" style="margin:0 0 1.25rem;font-size:.74rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--soft)">BLOG · 简体</p>
    <h1 class="rise rise-1">博客</h1>
  </section>

  <section class="wrap" style="padding-bottom:3.5rem" data-blog data-posts="../../blog/posts" data-repo="">
    <p class="blog-status" data-blog-status>正在载入文章…</p>
    <ul class="posts" data-blog-list hidden></ul>

    <article data-blog-post hidden>
      <h2 class="post-heading" data-blog-title></h2>
      <p class="post-meta" data-blog-meta></p>
      <div class="post-body" data-blog-body></div>
      <p style="margin-top:2rem"><a class="more" href="./" data-blog-back>← 回到列表</a></p>

      <section class="comments" data-blog-comments hidden
                 data-giscus-repo="Fragmented-Chaos/fragmented-chaos.github.io"
                 data-giscus-repo-id="R_kgDOVL5epQ"
                 data-giscus-category=""
                 data-giscus-category-id="">
        <h2 class="sec-head" style="margin:0 0 .75rem"><span style="font-size:1rem;font-weight:600;color:var(--ink);letter-spacing:0;text-transform:none">评论</span></h2>
        <button type="button" class="btn" data-comments-load>加载评论</button>
        <p class="comments-note" data-comments-note hidden>评论还没配置：需要填 data-repo 与 giscus 的三个 ID（见 README）。</p>
        <div data-comments-slot></div>
      </section>
    </article>

    <div data-blog-i18n hidden>
      <span data-i18n="loading">正在载入文章…</span>
      <span data-i18n="empty">还没有文章。</span>
      <span data-i18n="load_failed">文章列表加载失败（{err}）。</span>
      <span data-i18n="comments_unconfigured">评论还没配置：需要填 data-repo 与 giscus 的三个 ID（见 README）。</span>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap foot">
    <span>Fragmented_Chaos · StewedTuba73416 / Rending_Void</span>
    <span>博客</span>
  </div>
</footer>

<script src="../../assets/site.js" defer></script>
<script src="../../assets/blog.js" defer></script>
</body>
</html>
