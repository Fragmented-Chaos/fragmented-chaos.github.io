<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
    <meta name="description" content="{{ site.description | strip_html | strip_newlines | truncate: 160 }}">
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    <link rel="icon" href="{{ '/assets/images/logo.png' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bare-body">
    <main class="page-content">
      {{ content }}
    </main>

    <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      var moon = document.getElementById('icon-moon');
      var sun = document.getElementById('icon-sun');
      var KEY = 'fragmentedchaos-theme';
      function apply(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        var dark = theme === 'dark';
        if (moon) moon.style.display = dark ? 'inline-block' : 'none';
        if (sun) sun.style.display = dark ? 'none' : 'inline-block';
      }
      var saved = null;
      try { saved = localStorage.getItem(KEY); } catch (e) {}
      apply(saved || 'dark');
      if (btn) {
        btn.addEventListener('click', function () {
          var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          apply(next);
          try { localStorage.setItem(KEY, next); } catch (e) {}
        });
      }
    })();
    </script>
  </body>
</html>
