<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fragmented_Chaos</title>
<meta name="description" content="Fragmented_Chaos 的个人网站。">

<!-- 主题在首次绘制前定好（与 assets/site.js 同一个 key） -->
<script>
  (function () {
    try {
      var m = /[?&]theme=(light|dark)\b/.exec(location.search);
      var t = m ? m[1] : localStorage.getItem('site-v2.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* 隐私模式忽略 */ }
  })();
</script>

<link rel="stylesheet" href="../assets/base.css">
<style>
  /* ---- 起始页：一屏，只有名字、一句话和进入按钮 ---- */

  body { min-height: 100vh; display: flex; flex-direction: column; }

  .start-top {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 1.25rem;
    height: 4.25rem;
  }

  .start-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.75rem;
    padding: 2rem 1.5rem 4rem;
    text-align: center;
  }

  .start-kicker {
    margin: 0;
    font-family: var(--mono);
    font-size: 0.74rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .start-name {
    margin: 0;
    font-family: var(--hand);
    font-size: clamp(3.4rem, 13vw, 7.5rem);
    line-height: 0.98;
    letter-spacing: 0.005em;
    font-weight: 600;
  }

  .start-name b { color: var(--accent); font-weight: 600; }

  .start-rule {
    width: min(22rem, 70vw);
    height: 1px;
    background-color: var(--line);
  }

  .start-line {
    margin: 0;
    max-width: 26rem;
    color: var(--soft);
    font-size: 0.98rem;
  }

  .start-actions { display: flex; align-items: center; gap: 0.75rem; }

  .start-foot {
    padding-bottom: 2.25rem;
    text-align: center;
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--muted);
  }

  @media (max-width: 760px) {
    .start-main { gap: 1.35rem; }
  }
</style>
</head>
<body>

<header class="wrap start-top">
  <span class="lang">
    <a href="#" aria-current="true">简</a>
    <a href="#">繁</a>
    <a href="#">EN</a>
  </span>
  <button type="button" class="theme-toggle" data-theme-toggle
          aria-pressed="false"
          data-label-to-dark="切换到暗色主题" data-label-to-light="切换到亮色主题">
    <span class="sr-only">切换主题</span>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
      <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/>
    </svg>
  </button>
</header>

<main class="start-main">
  <p class="start-kicker rise">Personal site</p>
  <h1 class="start-name rise rise-1">Fragmented<b>_</b>Chaos</h1>
  <div class="start-rule rise rise-1" aria-hidden="true"></div>
  <p class="start-line rise rise-2">欢迎来到 Fragmented_Chaos 个人网站。站内有音乐、经历与联系方式。</p>
  <div class="start-actions rise rise-2">
    <a class="btn btn-primary" href="ab-mix.html">进入 <span class="arrow" aria-hidden="true">→</span></a>
  </div>
</main>

<footer class="wrap start-foot">
  简体 / 繁體 / English · 深色与亮色可切换
</footer>

<script src="../assets/site.js" defer></script>
</body>
</html>
